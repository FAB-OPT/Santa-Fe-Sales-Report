<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบส่งยอดขาย Santa Fe</title>

<style>
:root{
  --orange:#ff7a00;
  --bg:#f7e9dd;
  --card:#fff;
  --text:#0f172a;
  --border:rgba(15,23,42,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Sarabun',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:14px 18px;
padding-top:6px;padding-bottom:6px;padding-top:0px;padding-bottom:4px;margin-top:-10px;}
.header-inner{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns: 180px 1fr 220px;
  align-items:center;
  gap:12px;
  position:relative;
}
.brand-logo{
  height:134px;
  width:auto;
  justify-self:start;
transform:scale(0.9);}
.brand-title{
  font-size:40px;
  font-weight:800;
  letter-spacing:.2px;
  text-align:center;
  line-height:1.2;
  position:relative;
  left:0;
  margin:0;
  padding:0;
}
.brand-version{position:absolute;top:16px;right:41px;font-size:10px;color:#000;background:none;border:none;padding:0;box-shadow:none;line-height:1;}
@media(max-width:900px){
  .header-inner{grid-template-columns: 120px 1fr 170px;}
  .brand-logo{height:90px}
  .brand-title{font-size:30px}
}
@media(max-width:600px){
  .header{padding:12px 14px}
  .header-inner{
    grid-template-columns: 1fr;
    justify-items:center;
    gap:8px;
  }
  .brand-logo{height:93px}
  .brand-title{font-size:28px}
  .brand-version{justify-self:center}

  .brand-version{right:29px;top:6px;}
}

.wrap{max-width:1200px;margin:20px auto;padding:0 18px;display:flex;justify-content:center;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;width:min(1100px,100%);}
.section{margin-bottom:22px}
.section h2{margin:0 0 14px;background:var(--orange);color:#fff;padding:10px 12px;border-radius:12px;font-size:18px;text-align:center;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

/* spacing between question (label) and input to match reference */
label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:0 0 8px;
}
input,select{
  width:100%;
  padding:12px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:14px;
  background:#fff;
}
.hint{font-size:12px;color:#475569;margin-top:8px}
.actions{text-align:center;margin-top:22px}
button{
  background:var(--orange);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:12px 24px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}
button:disabled{opacity:.6}
.status{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:14px}
.status.ok{display:block;background:#e7f7ed;color:#15803d}
.status.err{display:block;background:#fee2e2;color:#b91c1c}
.footer{text-align:center;margin-top:16px;font-size:12px;color:#ff7a00;font-weight:700}

.center-row{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:16px;
  justify-items:center;
}
.center-row .form-group{
  width:100%;
  max-width:320px;
}

/* ===== Modal Popup (Sweet-like) ===== */
.modal-backdrop{
  position:fixed; inset:0;
  background:rgba(2,6,23,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:9999;
}
.modal-backdrop.show{display:flex}
.modal-card{
  width:min(520px, 100%);
  background:#fff;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  overflow:hidden;
}
.modal-body{
  padding:22px 22px 18px;
  text-align:center;
}
.modal-img{
  width:120px; height:120px;
  object-fit:contain;
  margin:0 auto 4px;
  display:none;
}
.modal-img.is-loading{
  display:block;
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{
  0%{transform:scale(0.98); opacity:.85}
  50%{transform:scale(1.03); opacity:1}
  100%{transform:scale(0.98); opacity:.85}
}
.modal-title{
  font-size:26px;
  font-weight:900;
  margin:0 0 10px;
  letter-spacing:.2px;
}
.modal-msg{
  font-size:16px;
  line-height:1.45;
  color:#475569;
  margin:0;
  white-space:pre-line;
}
.modal-backdrop.modal-spacious .modal-msg{
  font-size:17px;
  line-height:1.65;
}
.modal-backdrop.modal-spacious .modal-msg > div{
  margin:6px 0;
}
.modal-msg.small{font-size:13px;}

/* Lines rendering (no numbering) */
.modal-msg .modal-lines{
  display:inline-block;
  text-align:center;
  max-width:100%;
}
\.modal-msg .modal-lines > div{
  font-size:18px;
  line-height:1.6;
  margin:0 0 6px;
  letter-spacing:-0.1px;
}
.modal-msg .modal-lines > div.line-red{
  color:#d32f2f;
  font-weight:800;
}

.modal-msg .modal-list{
  display:inline-block;
  text-align:left;
  padding-left:26px;
  padding-right:18px;
  margin:0;
  max-width:100%;
  list-style-position:outside;
}

.modal-msg .modal-list li{
  font-size:18px;
  line-height:1.6;
  margin:0 0 10px;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
}

/* ===== Modal: error conditions list (no scrollbar, 1 item = 1 line) ===== */
.modal-backdrop.modal-error-nowrap .modal-card{
  /* keep original popup width; adjust text size instead */
}
.modal-backdrop.modal-error-nowrap .modal-body{
  padding-top:18px; /* move icon+title up a bit */
}
.modal-backdrop.modal-error-nowrap .modal-img{
  margin:0 auto 2px; /* tighter gap under icon */
}
.modal-backdrop.modal-error-nowrap .modal-title{
  margin:0 0 14px; /* add breathing room before list */
}
.modal-backdrop.modal-error-nowrap .modal-msg{
  font-size:14px;
}
.modal-backdrop.modal-error-nowrap .modal-msg .modal-list{
  display:inline-block;
  text-align:left;
  padding-left:26px;
  padding-right:18px;
  margin:0;
  max-width:100%;
  white-space:normal;
  overflow-wrap:anywhere;
}
.modal-backdrop.modal-error-nowrap .modal-msg .modal-list li{
  white-space:normal;
  font-size:18px;
  line-height:1.6;
  letter-spacing:0;
  margin:0 0 10px;
  overflow-wrap:anywhere;
  word-break:break-word;
}

/* Mobile: allow wrap so it won't overflow the screen */
@media(max-width:600px){
  .modal-backdrop.modal-error-nowrap .modal-card{ width:min(520px, 100%); }
  .modal-backdrop.modal-error-nowrap .modal-msg .modal-list,
  .modal-backdrop.modal-error-nowrap .modal-msg .modal-list li{
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
  }
}
  .modal-backdrop.modal-error-nowrap .modal-msg{ font-size:15px; }
  .modal-backdrop.modal-error-nowrap .modal-msg .modal-list li{
  white-space:nowrap;
  font-size:14px;     /* start larger; JS will auto-shrink if needed */
  line-height:1.25;
  letter-spacing:-0.1px;
  margin:0 0 6px;
}
}

/* ===== Modal: auto spacing when error list has multiple items ===== */ when error list has multiple items ===== */
.modal-backdrop.modal-error-multi .modal-body{ padding-top:18px; }
.modal-backdrop.modal-error-multi .modal-img{ margin:0 auto 2px; }
.modal-backdrop.modal-error-multi .modal-title{ margin:0 0 12px; }

/* On small screens allow wrapping to avoid horizontal scroll */
@media (max-width:600px){
  .modal-msg .modal-list, .modal-msg .modal-list li{ white-space:normal !important; }
}


/* ===== Modal (auto spacing when error list is long) ===== */
.modal-backdrop.modal-error-multi .modal-body{
  padding-top:20px; /* move content up a bit */
}
.modal-backdrop.modal-error-multi .modal-img{
  margin-bottom:4px;
}
.modal-backdrop.modal-error-multi .modal-title{
  margin-bottom:14px; /* give breathing room from message/list */
}
.modal-backdrop.modal-error-multi .modal-msg{
  font-size:15px;
}
.modal-backdrop.modal-error-multi .modal-msg .modal-list li{
  white-space:normal; /* allow wrap so it doesn't look cramped */
  line-height:1.35;
  margin:0 0 8px;
}

.modal-actions{
  padding:0 22px 22px;
}
.modal-btn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:14px 16px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  background:#f4e6d8;
  color:#b45309;
}
.modal-loading .modal-btn{display:none}
.spinner{
  width:46px;height:46px;
  border:5px solid rgba(255,122,0,.25);
  border-top-color: var(--orange);
  border-radius:999px;
  margin:4px auto 16px;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}


/* ===== Review (Summary) Overlay ===== */
.review-card{
  max-width:900px;
  width:min(900px,100%);
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
}
.review-title{font-size:20px;font-weight:800;margin:0 0 6px;text-align:center}
.review-sub{font-size:12px;opacity:.85;text-align:center;margin:0 0 12px}
.review-name{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  margin:0 0 12px;
  flex-wrap:wrap;
}
.review-name label{
  font-weight:800;
  font-size:13px;
}
.review-name input{
  width:min(420px,100%);
  padding:10px 12px;
  border-radius:12px;
  border:1px solid rgba(15,23,42,16);
  outline:none;
  font-weight:700;
  font-family:inherit;
  font-size:14px;
}
.review-name input:focus{
  border-color: rgba(255,122,0,0.9);
  box-shadow:0 0 0 3px rgba(255,122,0,0.18);
}
.review-section{margin:0 0 14px}
.review-section-title{
  margin:0 0 8px;
  background:var(--orange);
  color:#fff;
  font-weight:900;
  padding:8px 10px;
  border-radius:12px;
  text-align:center;
  font-size:14px;
}
.review-table{width:100%;border-collapse:collapse;font-size:14px}
.review-table th,.review-table td{border:1px solid rgba(15,23,42,.12);padding:8px 10px;vertical-align:top}
.review-table th{background:#fff7ee;width:34%;font-weight:800}
.review-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.review-actions .btn{
  border-radius:12px;
  border:1px solid rgba(15,23,42,.16);
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
}

.review-actions button.btn{background:#fff;color:var(--text);}

/* ปุ่มในหน้าสรุปคำตอบ */
.review-actions #reviewBack{
  background:#e11d48; /* แดง */
  color:#fff;
  border-color:transparent;
}
.review-actions #reviewConfirm{
  background:#16a34a; /* เขียว */
  color:#fff;
  border-color:transparent;
}
@media(max-width:600px){
  .review-table th{width:auto}
  .review-actions{justify-content:center}
}


.modal-backdrop.modal-error-nowrap .modal-msg .modal-list li{
  white-space:nowrap;
  font-size:14px;     /* start larger; JS will auto-shrink if needed */
  line-height:1.25;
  letter-spacing:-0.1px;
  margin:0 0 6px;
}
@media (max-width:600px){
  .modal-backdrop.modal-error-nowrap .modal-msg .modal-list li{
  white-space:nowrap;
  font-size:14px;     /* start larger; JS will auto-shrink if needed */
  line-height:1.25;
  letter-spacing:-0.1px;
  margin:0 0 6px;
}
}


/* === MOBILE HEADER FIX v1.3 (TARGET REAL CLASSES) === */
@media (max-width: 600px){

  /* 1) LOGO: bigger + centered */
  .brand-logo{
    display:block !important;
    margin:0 auto 10px auto !important;
    height:150px !important;      /* bigger */
    width:auto !important;
    transform:scale(1.0) !important; /* cancel 0.9 */
  }
  /* ensure container centers */
  .brand{
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
  }

  /* 2) TITLE: smaller + centered + single line */
  .brand-title{
    font-size:26px !important;
    line-height:1.15 !important;
    text-align:center !important;
    left:0 !important;            /* cancel relative left */
    white-space:nowrap !important;
    margin-top:6px !important;
  }

  /* 3) VERSION: move left +25px (from left edge) */
  .brand-version{
    left:25px !important;
    right:auto !important;
    top:10px !important;
  }
}



/* === PATCH v1: popup condition font + unify button font === */
.modal-list, .modal-list li{
  font-size:18px !important;
  line-height:1.6 !important;
}
.modal-list li{ margin:6px 0 !important; }

button{
  font-family:'Sarabun',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
  font-size:18px !important;
  font-weight:900 !important;
}
.modal-btn{
  font-family:'Sarabun',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
  font-size:18px !important;
  font-weight:900 !important;
}


/* ===== PATCH v3: Fix list text clipping in popups ===== */
.modal-msg .modal-list{
  display:block !important;
  width:100% !important;
  max-width:100% !important;
  box-sizing:border-box !important;
  padding-left:28px !important; /* keep numbering indent */
  padding-right:12px !important; /* breathing room to avoid right-edge clip */
  margin:0 auto !important;
}
.modal-msg .modal-list li{
  box-sizing:border-box !important;
  padding-right:8px !important;
  white-space:normal !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
}


/* ===============================
   Android only – Header fix
   =============================== */
@media screen and (max-width: 480px) {

  .container,
  .main-container,
  .card {
    position: relative;
  }

  .page-title,
  .header-title,
  h1.title {
    font-size: 16px;
    line-height: 1.3;
    max-width: 100%;
    margin: 0 auto 10px auto;
    padding: 0 12px;
    text-align: center;
    box-sizing: border-box;
    word-break: break-word;
    white-space: normal;
  }
}


/* ===============================
   ANDROID: tighten title to logo
   =============================== */
@media screen and (max-width: 480px) {

  /* ลดช่องว่างระหว่างโลโก้กับหัวข้อ */
  .header img,
  .logo {
    margin-bottom: 4px !important;
  }

  .header h1,
  .page-title,
  .header-title {
    margin-top: 2px !important;   /* 👈 ชิดโลโก้ขึ้น */
  }
}


/* ===============================
   HEADER POSITION PER DEVICE
   =============================== */

/* ANDROID: ชิดโลโก้มากขึ้น */
@media screen and (max-width: 480px) and (orientation: portrait) {
  .header h1,
  .page-title,
  .header-title {
    margin-top: -6px !important; /* ดันขึ้นชิดโลโก้จริง */
  }
}

/* DESKTOP: ขยับหัวข้อไปขวา 30px */
@media screen and (min-width: 1024px) {
  .header h1,
  .page-title,
  .header-title {
    position: relative;
    left: 30px;
  }
}

/* iOS (iPhone): ขยับหัวข้อไปซ้าย 20px */
@supports (-webkit-touch-callout: none) {
  @media screen and (max-width: 480px) {
    .header h1,
    .page-title,
    .header-title {
      position: relative;
      left: -20px;
    }
  }
}


/* ===============================
   HEADER: lock to real element (.brand-title)
   Only moves the title; nothing else.
   =============================== */

/* Always neutralize the inline margin-left on the title (we will control per device) */
.brand-title{ margin-left: 0 !important; }

/* ANDROID: tighter to logo + centered inside white header */
.is-android .brand-title{
  text-align: center !important;
}
@media (max-width: 600px){
  .is-android .brand-title{
    transform: translateY(-34px) !important; /* 👈 ชิดโลโก้เพิ่ม */
    margin-top: 0 !important;
  }
}

/* DESKTOP: move title right 30px */
@media (min-width: 901px){
  .brand-title{
    transform: translateX(30px) !important;
  }
}

/* iPhone/iOS: move title left 20px */
@media (max-width: 600px){
  .is-ios .brand-title{
    transform: translateX(-20px) translateY(-20px) !important;
  }
}

function escapeHtml(str){
  return str.replace(/[&<>"\']/g, (c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;" }[c]));
}


function fitErrorListToOneLine(){
  // Only for desktop/tablet; on mobile we allow wrapping
  if (window.matchMedia && window.matchMedia("(max-width:600px)").matches) return;

  const list = modalEl.querySelector(".modal-msg .modal-list");
  if (!list) return;

  // Reset any prior inline sizing
  list.querySelectorAll("li").forEach(li=>{
    li.style.fontSize = "";
    li.style.letterSpacing = "";
  });

  // Try shrinking step-by-step until all items fit in one line, but not smaller than 12px
  let size = 14;
  const min = 12;
  const step = 0.5;

  while (size >= min){
    let ok = true;

    for (const li of Array.from(list.querySelectorAll("li"))){
      li.style.fontSize = size + "px";
      li.style.letterSpacing = (size <= 13 ? "-0.2px" : "-0.1px");

      // If content overflows (nowrap), scrollWidth will be greater than clientWidth
      if (li.scrollWidth - li.clientWidth > 1){
        ok = false;
        break;
      }
    }

    if (ok) break;
    size -= step;
  }
}

function showModal(type, title, messageLines, opts={}){
  const { loading=false } = opts;

  // reset
  modalEl.classList.toggle("show", true);
  modalEl.classList.toggle("modal-loading", !!loading);
  modalEl.setAttribute("aria-hidden","false");

  // auto spacing: if error + numbered list has multiple lines, relax spacing to avoid cramped layout
  const msgCount = (Array.isArray(messageLines) ? messageLines.filter(Boolean).length : 0);
  const isMultiErrorList = (!loading && type === "error" && !!opts.numbered && msgCount > 1);
  modalEl.classList.toggle("modal-error-multi", isMultiErrorList);
  const isErrorNowrap = (!loading && type === "error" && !!opts.numbered && msgCount > 0);
  modalEl.classList.toggle("modal-error-nowrap", isErrorNowrap);
  // extra spacing option
  modalEl.classList.toggle("modal-spacious", !!opts.spacious);


  modalTitle.textContent = title || "";
  // message rendering
  const arr = Array.isArray(messageLines) ? messageLines.filter(Boolean) : null;
  const numbered = !!opts.numbered;
  // "small" should be an explicit option only (not forced by numbered)
  modalMsg.classList.toggle("small", !!opts.small);

  if (arr && numbered) {
    modalMsg.innerHTML = `<ol class="modal-list">${arr.map((t)=>"<li>"+escapeHtml(String(t))+"</li>").join("")}</ol>`;
    // Auto-fit: keep each condition on one line without resizing the popup
    if (type === "error" && opts.numbered) { try{ fitErrorListToOneLine(); }catch(e){} }
  } else if (arr) {
    // Render as lines (no numbering)
    modalMsg.innerHTML = `<div class="modal-lines">${
      arr.map(t=>{
        const raw = String(t);
        const isRed = raw.startsWith("!!RED!!");
        const msg = isRed ? raw.replace(/^!!RED!!\s*/, "") : raw;
        return `<div class="${isRed ? "line-red" : ""}">${escapeHtml(msg)}</div>`;
      }).join("")
    }</div>`;
  } else {
    modalMsg.textContent = String(messageLines || "");
  }

  // loading state
  modalImg.classList.toggle("is-loading", !!loading);

  if (loading) {
    // show sending icon
    modalImg.src = MODAL_IMG_SENDING;
    modalImg.style.display = "block";
    modalSpinner.style.display = "none";
    modalBtn.style.display = "none";
    return;
  }

  // normal state
  modalSpinner.style.display = "none";
  modalBtn.style.display = "block";

  if (type === "success") {
    modalImg.src = MODAL_IMG_SUCCESS;
    modalImg.style.display = "block";
  } else if (type === "error") {
    modalImg.src = MODAL_IMG_ERROR;
    modalImg.style.display = "block";
  } else {
    modalImg.removeAttribute("src");
    modalImg.style.display = "none";
  }
}


// ===== Duplicate popup helpers =====
function parseTsTextToMs_(tsText){
  const s = String(tsText||"").trim();
  if (!s) return null;
  // expects "yyyy-MM-dd HH:mm:ss"
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})(?::(\d{2}))?$/);
  if (!m) return null;
  const y=+m[1], mo=+m[2]-1, d=+m[3], hh=+m[4], mm=+m[5], ss=+(m[6]||0);
  // build in local time (browser). For Thailand users this matches Apps Script timezone.
  return new Date(y, mo, d, hh, mm, ss).getTime();
}

// pick timestamp ms from various possible response field names
function getDupTimestampMs_(dupObj){
  const d = dupObj || {};
  const ms = (typeof d.timestamp === "number" && isFinite(d.timestamp)) ? d.timestamp
          : (typeof d.ts === "number" && isFinite(d.ts)) ? d.ts
          : (typeof d.time === "number" && isFinite(d.time)) ? d.time
          : null;
  if (ms !== null) return ms;
  const tsText = d.timestampText || d.timestamp_text || d.tsText || d.ts_text || d.timestampStr || d.timestamp_str || "";
  return parseTsTextToMs_(tsText);
}

function formatThaiDateTime_(ms){
  if (!ms && ms!==0) return null;
  const d = new Date(ms);
  if (isNaN(d.getTime())) return null;
  const pad = n => String(n).padStart(2,"0");
  // ต้องการรูปแบบ 16.00 28/12/2025
  return `${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}

// ====== Date default (today) ======
function setTodayDate(){
  const el = document.getElementById("submit_date");
  if(!el) return;
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  el.value = `${yyyy}-${mm}-${dd}`;
}


function extractBranchCode_(v){
  const s = String(v||"").trim();
  const m = s.match(/^(\d{4,6})/);
  return m ? m[1] : s;
}

// ✅ OPTION #2: เก็บค่า "สาขา" เป็นชื่อเต็มเหมือนเดิม (เช่น '5005 เดอะมอลล์ บางกะปิ')
// แต่ระบบกันซ้ำ/กฎต่าง ๆ จะใช้ "รหัสสาขา" จาก extractBranchCode_ ภายใน API แทน
function fillSelect(id, list){
  const sel = document.getElementById(id);
  if (!sel) return;
  sel.innerHTML = "<option value=''>-- เลือก --</option>";

  (list||[]).forEach(v=>{
    const o = document.createElement("option");
    o.value = String(v);        // ✅ ส่งชื่อเต็ม
    o.textContent = String(v);  // ✅ แสดงชื่อเต็ม
    if (String(id) === "branch") o.dataset.code = extractBranchCode_(v);
    sel.appendChild(o);
  });
}
// ====== Numeric lock + comma + 0.00 ======
const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });

function sanitizeNumeric(raw){
  let s = String(raw ?? "");
  s = s.replace(/,/g,"");
  s = s.replace(/[^0-9.]/g,"");
  const firstDot = s.indexOf(".");
  if (firstDot !== -1) {
    s = s.slice(0, firstDot+1) + s.slice(firstDot+1).replace(/\./g,"");
    const parts = s.split(".");
    s = parts[0] + "." + (parts[1] || "").slice(0,2);
  }
  return s;
}

function format2(raw){
  const s = sanitizeNumeric(raw).trim();
  if (s === "") return "";
  const n = Number(s);
  if (!Number.isFinite(n)) return "";
  return nf2.format(n);
}

function n0(v){
  const s = sanitizeNumeric(v).trim();
  if (s === "") return 0;
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function attachNumericBehaviors(){
  NUMERIC_IDS.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;

    try { el.type = "text"; } catch(e){}
    el.setAttribute("inputmode","decimal");
    el.setAttribute("placeholder","0.00");
    el.setAttribute("autocomplete","off");

    el.addEventListener("beforeinput", (ev)=>{
      if (!ev.data) return;
      const next = el.value.slice(0, el.selectionStart) + ev.data + el.value.slice(el.selectionEnd);
      const sanitized = sanitizeNumeric(next);
      if (sanitized !== next) ev.preventDefault();
    });

    el.addEventListener("input", ()=>{
      const s = sanitizeNumeric(el.value);
      if (el.value !== s) el.value = s;
    });

    el.addEventListener("paste", (ev)=>{
      ev.preventDefault();
      const text = (ev.clipboardData || window.clipboardData).getData("text");
      const s = sanitizeNumeric(text);
      document.execCommand("insertText", false, s);
    });

    el.addEventListener("blur", ()=>{
      el.value = format2(el.value);
    });

    el.addEventListener("focus", ()=>{
      el.value = String(el.value||"").replace(/,/g,"");
    });
  });
}

function clearFields(ids){

// ====== Time-slot rule (16.00 = only 2.1/2.2) ======
const __DEFAULT_FIELD_STATE = {};
function cacheDefaultFieldState_(){
  document.querySelectorAll("#salesForm input, #salesForm select").forEach(el=>{
    __DEFAULT_FIELD_STATE[el.id] = {
      required: !!el.required,
      disabled: !!el.disabled,
      placeholder: (el.getAttribute("placeholder") || "")
    };
  });
}

function restoreFieldState_(id){
  const el = document.getElementById(id);
  const st = __DEFAULT_FIELD_STATE[id];
  if (!el || !st) return;
  el.required = !!st.required;
  el.disabled = !!st.disabled;
  if (st.placeholder) el.setAttribute("placeholder", st.placeholder);
  el.classList.remove("field-locked");
}

function lockField_(id){
  const el = document.getElementById(id);
  if (!el) return;
  el.value = "";
  el.required = false;
  el.disabled = true;
  el.classList.add("field-locked");
}

function applyTimeSlotRulesUI_(){
  const ts = document.getElementById("submit_time_slot");
  const slot = ts ? String(ts.value||"").trim() : "";
  const is16 = slot === "16.00";
  const isEndDay = slot === "สิ้นวัน";

  const lockIds = [
    "sale_dine_in","sale_take_away","sale_grab","sale_lineman","sale_shopeefood",
    "total_trans","trans_dine_in","trans_take_away","trans_grab","trans_lineman","trans_shopeefood",
    "customer","labour_hour","labour_baht"
  ];

  // 16.00: lock other fields (ไม่ให้กรอก) ตามกติกาเดิม
  lockIds.forEach(id=>{
    if (is16) lockField_(id);
    else restoreFieldState_(id);
  });

  // 2.2 Actual Sale: ต้องกรอกทุกกรณี (16.00/สิ้นวัน/อื่นๆ)
  (function(){
    const el = document.getElementById("actual_sale");
    if (!el) return;
    el.disabled = false;
    el.required = true;
    el.classList.remove("field-locked");
  })();

  // 2.1 Plan Sale:
  // - 16.00: ต้องกรอก
  // - สิ้นวัน: ปิดช่องไปเลย (ไม่แสดง / ไม่บังคับ / ไม่ส่งค่า)
  // - อื่นๆ: เปิด แต่ไม่บังคับ
  (function(){
    const el = document.getElementById("plan_sale");
    if (!el) return;

    if (isEndDay) {
      // สิ้นวัน: ล็อกช่องเหมือนรอบ 16.00 และระบุในช่องว่าไม่ต้องกรอก
      el.value = "";
      el.required = false;
      el.disabled = true;
      el.classList.add("field-locked");
      el.setAttribute("placeholder", "รอบสิ้นวันไม่ต้องกรอก");
      return;
    }

    // กรณีอื่น: เปิดช่องตามปกติ (16.00 บังคับกรอก)
    el.disabled = false;
    el.required = is16;
    el.classList.remove("field-locked");
    // คืน placeholder เดิมจากค่า default ที่ cache ไว้
    const st = __DEFAULT_FIELD_STATE["plan_sale"];
    if (st && st.placeholder) el.setAttribute("placeholder", st.placeholder);
  })();
}

// ===== Hidden iframe bridge (more reliable than JSONP in modern browsers) =====
function iframeBridgeRequest(mode, payload, timeoutMs = 60000) {
  return new Promise((resolve) => {
    const requestId = "req_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const qsObj = Object.assign({ mode, request_id: requestId }, payload || {});
    const qs = new URLSearchParams(qsObj).toString();
    const src = WEB_APP_URL + "?" + qs + "&_=" + Date.now();
    LAST_JSONP_URL = src;

    let done = false;
    let iframe = null;

    const cleanup = () => {
      try { window.removeEventListener("message", onMessage); } catch(_) {}
      try { if (iframe) iframe.remove(); } catch(_) {}
    };

    const finish = (data) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      resolve(data || { ok:false });
    };

    const onMessage = (event) => {
      const msg = event && event.data;
      if (!msg || msg.source !== "sales_report_bridge") return;
      if (String(msg.requestId || "") !== requestId) return;
      finish(msg.payload || { ok:false });
    };

    const timer = setTimeout(() => {
      finish({ ok:false, timeout:true, url: src, bridge_failed:true });
    }, timeoutMs);

    window.addEventListener("message", onMessage);

    iframe = document.createElement("iframe");
    iframe.style.display = "none";
    iframe.setAttribute("aria-hidden", "true");
    iframe.referrerPolicy = "no-referrer";
    iframe.onerror = () => {
      finish({ ok:false, bridge_failed:true, url: src });
    };
    iframe.src = src;
    document.body.appendChild(iframe);
  });
}

function jsonpCheckDup(payload, timeoutMs = 60000) {
  return iframeBridgeRequest("checkdup_bridge", {
    district_manager: payload.district_manager || "",
    branch: payload.branch || "",
    submit_date: payload.submit_date || "",
    submit_time_slot: payload.submit_time_slot || ""
  }, timeoutMs);
}

function jsonpSubmit(payload, timeoutMs = 120000) {
  return iframeBridgeRequest("submit_bridge", Object.assign({}, payload || {}), timeoutMs);
}

function prevDateYMD_(ymd){
  try{
    const s = String(ymd||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return "";
    const d = new Date(s + "T00:00:00+07:00");
    d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  }catch(_){ return ""; }
}

function formatThaiDateYMD_(ymd){
  try{
    const s = String(ymd||"").trim();
    if(!s) return "";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const parts = s.split("-");
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }catch(_){
    return String(ymd||"").trim();
  }
}

function buildDuplicateModal_(dupObj, payload){
  const d = dupObj || {};
  const tsMs = getDupTimestampMs_(d);
  const sentAt = formatThaiDateTime_(tsMs);
  const who = (String(d.submitter_name||"").trim() || String(payload?.submitter_name||"").trim());
  const lines = [];
  if (sentAt) lines.push("เมื่อเวลา: " + sentAt);
  if (who) lines.push("ผู้ส่ง: " + who);
  return { type:"success", title:"ระบบได้รับข้อมูลแล้ว", lines, opts:{ numbered:false, spacious:true } };
}


function buildApiErrorModal_(res, payload){
  const r = res || {};
  const code = String(r.code||"").trim();
  const err = String(r.userMessage || r.error || "ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่").trim();

  // Busy / lock queue
  if ((r.error && String(r.error).toLowerCase().includes("busy")) || err.toLowerCase().includes("acquire lock")){
    return {
      type:"error",
      title:"ระบบกำลังมีการใช้งานสูง",
      lines:[
        "⏳ ขณะนี้มีหลายสาขากำลังส่งข้อมูลพร้อมกัน",
        "กรุณารอ 10–20 วินาที แล้วลองส่งใหม่อีกครั้ง"
      ],
      opts:{ numbered:false, spacious:true }
    };
  }

  // NEW: Must send previous day EOD first
  if (code === "MUST_SEND_PREV_EOD_FIRST"){
    const today = String(payload?.submit_date || r.submit_date || "").trim();
    const prev = String(r.requiredDate || r.required_date || "").trim() || prevDateYMD_(today);
    const prevDMY = formatThaiDateYMD_(prev);
    return {
      type:"error",
      title:"ยังส่งรอบ 16.00 ไม่ได้",
      lines:[
        'ต้องส่งข้อมูลรอบ "สิ้นวัน" ของวันที่ ' + (prevDMY || prev || "-") + " ก่อน",
        'จากนั้นจึงส่งรอบ “16.00” ได้'
      ],
      opts:{ numbered:false, spacious:true }
    };
  }

  // Must send 16.00 first (same day)
  if (code === "MUST_SEND_1600_FIRST"){
    return {
      type:"error",
      title:"ยังส่งรอบ สิ้นวัน ไม่ได้",
      lines:[
        "ต้องส่งข้อมูลรอบ 16.00 ก่อน",
        "จากนั้นจึงส่งรอบ สิ้นวัน ได้"
      ],
      opts:{ numbered:false, spacious:true }
    };
  }

  // Labour validation
  if (code === "LABOUR_HOUR_GE_BAHT"){
    return {
      type:"error",
      title:"ส่งข้อมูลไม่สำเร็จ",
      lines:[
        "⚠️ เงื่อนไขไม่ผ่าน: Labour (hour) ต้องน้อยกว่า Labour (Baht)",
        "โปรดตรวจสอบตัวเลขอีกครั้ง แล้วลองส่งใหม่"
      ],
      opts:{ numbered:false, spacious:true }
    };
  }

  // Default
  return { type:"error", title:"ส่งข้อมูลไม่สำเร็จ", lines:[err], opts:{ numbered:false, spacious:true } };
}

async function doSend(payload, btn){
  const payloadToSend = { ...payload };
// ✅ Server-side duplicate check (JSONP) BEFORE submit
  try {
    const dupRes = await jsonpCheckDup(payloadToSend);
    if (!dupRes || dupRes.ok !== true) throw new Error("dupcheck_failed");
    if (dupRes.duplicated) {
      const d = dupRes.duplicate || {};
      const tsMs = getDupTimestampMs_(d);

      const sentAt = formatThaiDateTime_(tsMs);
      const lines = [
        "ข้อมูลรอบนี้ถูกส่งเรียบร้อยแล้ว",
        "1.1 ผู้จัดการเขต: " + (d.district_manager || payloadToSend.district_manager || "-"),
        "1.2 สาขา: " + (d.branch || payloadToSend.branch || "-"),
        "1.3 วันที่ส่งข้อมูล: " + (d.submit_date || payloadToSend.submit_date || "-"),
        "1.4 ช่วงเวลา: " + (d.submit_time_slot || payloadToSend.submit_time_slot || "-")
      ];
      if (sentAt) {
        const byName = (String(d.submitter_name || "").trim() || String(payloadToSend.submitter_name || "").trim());
        const tail = byName ? (" โดย " + byName) : "";
        lines.push("ระบบได้รับข้อมูลเมื่อ " + sentAt + tail);
      }

      const m = buildDuplicateModal_(d, payloadToSend);
      showModal(m.type, m.title, m.lines, m.opts);

      if (btn) { btn.disabled = false; btn.textContent = "ตรวจสอบข้อมูล"; }
      return;
    }
} catch (e) {
    // ❗ถ้าเช็คซ้ำไม่ได้ = ห้ามส่งต่อ (กันเด้งสำเร็จมั่ว)
    showModal("error","เชื่อมต่อเซิร์ฟเวอร์ไม่ได้",[
      "ไม่สามารถตรวจสอบข้อมูลซ้ำได้",
      "URL ที่เรียก: " + (LAST_JSONP_URL || WEB_APP_URL),
      "URL นี้เปิดได้ แปลว่า backend ตอบแล้ว",
      "แต่เบราว์เซอร์บล็อกการโหลดแบบ script เดิม",
      "ไฟล์นี้ถูกปรับให้ใช้ iframe bridge แล้ว กรุณาอัปโหลด HTML ตัวใหม่"
    ]);
    if (btn) { btn.disabled = false; btn.textContent = "ตรวจสอบข้อมูล"; }
    return;
  }

  // sanitize numeric
  NUMERIC_IDS.forEach(k=>{
    if(payloadToSend[k] === undefined || payloadToSend[k] === null) return;
    payloadToSend[k] = sanitizeNumeric(payloadToSend[k]).trim();
  });

  try{
    showModal("sending","กำลังส่งข้อมูล",["กรุณารอสักครู่..."]);

    // ✅ Submit via JSONP (GET) so we can read result (no CORS, no false success)
    const res = await jsonpSubmit(payloadToSend);

    if (res && res.duplicated){
      const d = res.duplicate || {};
      const tsMs = getDupTimestampMs_(d);

      const sentAt = formatThaiDateTime_(tsMs);
      const lines = [
        "ข้อมูลรอบนี้ถูกส่งเรียบร้อยแล้ว",
        "1.1 ผู้จัดการเขต: " + (d.district_manager || payloadToSend.district_manager || "-"),
        "1.2 สาขา: " + (d.branch || payloadToSend.branch || "-"),
        "1.3 วันที่ส่งข้อมูล: " + (d.submit_date || payloadToSend.submit_date || "-"),
        "1.4 ช่วงเวลา: " + (d.submit_time_slot || payloadToSend.submit_time_slot || "-")
      ];
      if (sentAt) {
        const byName = (String(d.submitter_name || "").trim() || String(payloadToSend.submitter_name || "").trim());
        const tail = byName ? (" โดย " + byName) : "";
        lines.push("ระบบได้รับข้อมูลเมื่อ " + sentAt + tail);
      }

      const m = buildDuplicateModal_(d, payloadToSend);
      showModal(m.type, m.title, m.lines, m.opts);

      return;
    }


    // ✅ AUTO-RECOVERY: ถ้า submit timeout / JSONP failed -> ตรวจซ้ำทันทีว่าข้อมูลเข้าแล้วหรือยัง
    if (res && (res.timeout === true || res.jsonp_failed === true)) {
      try {
        const dup2 = await jsonpCheckDup(payloadToSend, 60000);
        if (dup2 && dup2.ok === true && dup2.duplicated === true) {
          showModal("success","ข้อมูลรอบนี้ถูกส่งแล้ว",[
            "✅ ระบบได้รับข้อมูลแล้ว (ตรวจพบข้อมูลในระบบหลังจากเชื่อมต่อช้า)",
            "ไม่จำเป็นต้องกดส่งซ้ำ"
          ], { numbered:false, spacious:true });
          document.getElementById("salesForm").reset();
          fillSelect("district_manager", DM_OPTIONS);
          fillSelect("branch", BRANCH_OPTIONS);
          (function(){
            const dmSel = document.getElementById("district_manager");
            const brSel = document.getElementById("branch");
            const dmPh = dmSel && dmSel.querySelector("option[value='']");
            if (dmPh) dmPh.textContent = "— เลือกผู้จัดการเขต —";
            const brPh = brSel && brSel.querySelector("option[value='']");
            if (brPh) brPh.textContent = "— เลือกสาขา —";
            if (dmSel) dmSel.value = "";
            if (brSel) { brSel.value = ""; brSel.disabled = true; }
          })();
          fillSelect("submit_time_slot", TIME_OPTIONS);
          applyTimeSlotRulesUI_();
          return;
        }
      } catch(_) {}

      showModal("error","ส่งข้อมูลไม่สำเร็จ",[
        "การเชื่อมต่อช้า (timeout)",
        "ตรวจสอบแล้วยังไม่พบข้อมูลในระบบ",
        "กรุณากดส่งใหม่อีกครั้ง"
      ]);
      return;
    }

if (!res || res.ok !== true){
      const m = buildApiErrorModal_(res, payloadToSend);
      showModal(m.type, m.title, m.lines, m.opts);
      return;
    }

    showModal("success","ส่งข้อมูลเรียบร้อย",["ระบบได้รับข้อมูลแล้ว"]);

    document.getElementById("salesForm").reset();
    fillSelect("district_manager", DM_OPTIONS);
    fillSelect("branch", BRANCH_OPTIONS);
    (function(){
      const dmSel = document.getElementById("district_manager");
      const brSel = document.getElementById("branch");
      const dmPh = dmSel && dmSel.querySelector("option[value='']");
      if (dmPh) dmPh.textContent = "— เลือกผู้จัดการเขต —";
      const brPh = brSel && brSel.querySelector("option[value='']");
      if (brPh) brPh.textContent = "— เลือกสาขา —";
      if (dmSel) dmSel.value = "";
      if (brSel) { brSel.value = ""; brSel.disabled = true; }
    })();

    fillSelect("submit_time_slot", TIME_OPTIONS);
    applyTimeSlotRulesUI_();
    (function(){
      const tsSel = document.getElementById("submit_time_slot");
      if (tsSel) tsSel.addEventListener("change", applyTimeSlotRulesUI_);
    })();

  }catch(err){
    showModal("error","ส่งข้อมูลไม่สำเร็จ",[String(err?.message||err)]);
  }finally{
    if (btn) { btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล"; }
  }
}

  labour_hour:"4.2 Labour (hour)",
  labour_baht:"4.3 Labour (Baht)"
};

function prettyValue(id, v){
  const s = String(v ?? "").trim();
  if (s === "") return "-";
  if (NUMERIC_IDS.includes(id)) return format2(s) || "-";
  return s;
}

function buildReviewContent(payload){
  try{
    const nm = document.getElementById("reviewReporter");
    if (nm){
      const raw = String(nm.value||"").trim();
      // send only first name (ตัดที่วรรคแรก)
      payload.submitter_name = (raw.split(/\s+/)[0] || "");
    }
  }catch(e){}
  const sections = [
    { title: "ส่วนที่ 1: ข้อมูลทั่วไป", ids: ["district_manager","branch","submit_date","submit_time_slot"] },
    { title: "ส่วนที่ 2: Sale", ids: ["plan_sale","actual_sale","sale_dine_in","sale_take_away","sale_grab","sale_lineman","sale_shopeefood"] },
    { title: "ส่วนที่ 3: Trans", ids: ["total_trans","trans_dine_in","trans_take_away","trans_grab","trans_lineman","trans_shopeefood"] },
    { title: "ส่วนที่ 4: Customer & Labour", ids: ["customer","labour_hour","labour_baht"] },
  ];

  const makeTable = (ids)=> {
    const rows = ids.map(id=>{
      const label = REVIEW_LABELS[id] || id;
      const value = prettyValue(id, payload[id]);
      return `<tr><th>${label}</th><td>${value}</td></tr>`;
    }).join("");
    return `<table class="review-table">${rows}</table>`;
  };

  const html = sections.map(sec=>{
    return `
      <div class="review-section">
        <div class="review-section-title">${sec.title}</div>
        ${makeTable(sec.ids)}
      </div>
    `;
  }).join("");

  const wrap = document.getElementById("reviewContent");
  if (wrap) wrap.innerHTML = html;
}

function openReview(payload){
  __pendingPayload = payload;
  buildReviewContent(payload);
  try{
    const nm = document.getElementById("reviewReporter");
    if (nm){ nm.value=""; nm.focus(); }
  }catch(e){}
  const ov = document.getElementById("reviewOverlay");
  if (ov){ ov.style.display="flex"; ov.setAttribute("aria-hidden","false"); }
}

function closeReview(){
  const ov = document.getElementById("reviewOverlay");
  if (ov){ ov.style.display="none"; ov.setAttribute("aria-hidden","true"); }
}

// Wire buttons
document.addEventListener("DOMContentLoaded", ()=>{
  const back = document.getElementById("reviewBack");
  const ok = document.getElementById("reviewConfirm");
  const nm = document.getElementById("reviewReporter");
  if (nm) nm.addEventListener("input", ()=>{ try{ if(__pendingPayload) buildReviewContent(__pendingPayload); }catch(e){} });
  if (back) back.addEventListener("click", ()=>{ closeReview(); });
  if (ok) ok.addEventListener("click", async ()=>{
    const btn = document.getElementById("btnSubmit");
    if (!__pendingPayload) return;

    // ===== ต้องกรอกชื่อผู้ลงข้อมูลในหน้าสรุป =====
    const nmEl = document.getElementById("reviewReporter");
    const name = (nmEl ? nmEl.value : "").trim();
    if (!name){
      showModal("error","ข้อมูลไม่ถูกต้อง",["กรุณากรอกชื่อผู้ลงข้อมูลก่อนยืนยันส่งข้อมูล"]);
      try{ if(nmEl) nmEl.focus(); }catch(e){}
      return;
    }
    __pendingPayload.submitter_name = name;

    closeReview();

    // Now actually send
    if (btn){ btn.disabled=true; btn.textContent="กำลังตรวจสอบ..."; }
    showModal("info","กำลังส่งข้อมูล",[""],{loading:true});
    await doSend(__pendingPayload, btn);
    __pendingPayload = null;
  });
});

document.getElementById("salesForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn=document.getElementById("btnSubmit");
  btn.disabled=true; btn.textContent="กำลังตรวจสอบ...";

  const payload={};
  document.querySelectorAll("#salesForm input, #salesForm select").forEach(el=>payload[el.id]=el.value);

  for (const k of ["district_manager","branch","submit_date","submit_time_slot"]){
    if(!payload[k] || String(payload[k]).trim()===""){
      showModal("error","กรุณากรอกข้อมูลให้ครบถ้วน",["กรุณากรอก/เลือกข้อมูลให้ครบถ้วน"]);
      btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
      return;
    }
  }


  const is16 = String(payload.submit_time_slot||"").trim() === "16.00";
  const LOCK_IDS_16 = [
    "sale_dine_in","sale_take_away","sale_grab","sale_lineman","sale_shopeefood",
    "total_trans","trans_dine_in","trans_take_away","trans_grab","trans_lineman","trans_shopeefood",
    "customer","labour_hour","labour_baht"
  ];

  // ✅ ถ้าเลือกช่วงเวลา 16.00: บังคับกรอกเฉพาะ 2.1 (Plan) และ 2.2 (Actual) และ "ห้ามใส่" ช่องอื่น
  if (is16){
    if(!payload.plan_sale || String(payload.plan_sale).trim()==="" || !payload.actual_sale || String(payload.actual_sale).trim()===""){
      showModal("error","กรุณากรอกข้อมูลให้ครบถ้วน",["กรุณากรอกข้อมูลในส่วนที่ 2 (เฉพาะ 2.1 Plan Sale และ 2.2 Actual Sale)"]);
      btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
      return;
    }

    const filledForbidden = [];
    LOCK_IDS_16.forEach(id=>{
      const raw = String(payload[id] ?? "").trim();
      if (!raw) return;
      // allow 0 / 0.00 as "not filled"
      const n = n0(raw);
      if (n !== 0) filledForbidden.push(REVIEW_LABELS[id] || id);
    });

    if (filledForbidden.length > 0){
      showModal("error","ข้อมูลไม่ถูกต้อง",[
        "ช่วงเวลา 16.00 อนุญาตให้กรอกเฉพาะ 2.1 Plan Sale และ 2.2 Actual Sale เท่านั้น",
        "กรุณาลบข้อมูลในช่อง: " + filledForbidden.join(", ")
      ], { numbered:false });
      btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
      return;
    }

    // ผ่านเงื่อนไข 16.00 -> ข้ามกฎ Sale/Trans อื่นๆ และไปหน้าสรุปได้เลย
    btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
    openReview(payload);
    return;
  }

  // ✅ กรณีช่วงเวลาอื่น: ต้องกรอก Actual + Dine In ตามเดิม
  if(!payload.actual_sale || String(payload.actual_sale).trim()==="" || !payload.sale_dine_in || String(payload.sale_dine_in).trim()===""){
    showModal("error","กรุณากรอกข้อมูลให้ครบถ้วน",["กรุณากรอกข้อมูลในส่วนที่ 2 ให้ครบถ้วน"]);
    btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
    return;
  }

    // === เงื่อนไขเพิ่มเติม: Sale ↔ Trans ต้องกรอกคู่กัน ===
  const missingPairFields = [];

  // Take away (2.4 ↔ 3.3)
  if (n0(payload.sale_take_away) > 0 && n0(payload.trans_take_away) <= 0) missingPairFields.push("3.3 Take away");
  if (n0(payload.trans_take_away) > 0 && n0(payload.sale_take_away) <= 0) missingPairFields.push("2.4 Take away");

  // Grab (2.5 ↔ 3.4)
  if (n0(payload.sale_grab) > 0 && n0(payload.trans_grab) <= 0) missingPairFields.push("3.4 Grab");
  if (n0(payload.trans_grab) > 0 && n0(payload.sale_grab) <= 0) missingPairFields.push("2.5 Grab");

  // Line Man (2.6 ↔ 3.5)
  if (n0(payload.sale_lineman) > 0 && n0(payload.trans_lineman) <= 0) missingPairFields.push("3.5 Line Man");
  if (n0(payload.trans_lineman) > 0 && n0(payload.sale_lineman) <= 0) missingPairFields.push("2.6 Line Man");

  // Shopee Food (2.7 ↔ 3.6)
  if (n0(payload.sale_shopeefood) > 0 && n0(payload.trans_shopeefood) <= 0) missingPairFields.push("3.6 Shopee Food");
  if (n0(payload.trans_shopeefood) > 0 && n0(payload.sale_shopeefood) <= 0) missingPairFields.push("2.7 Shopee Food");

  if (missingPairFields.length > 0){
    // ต้องแจ้งส่วนที่ 2 (Sale) ก่อนเสมอ ถ้ามีทั้งส่วนที่ 2 และ 3
    const ordered = [...missingPairFields].sort((a,b)=>{
      const pa = a.trim().startsWith("2.") ? 2 : 3;
      const pb = b.trim().startsWith("2.") ? 2 : 3;
      if (pa !== pb) return pa - pb; // 2 มาก่อน 3
      const na = parseFloat((a.match(/(\d+\.\d+)/)||[])[1] || "0");
      const nb = parseFloat((b.match(/(\d+\.\d+)/)||[])[1] || "0");
      return na - nb;
    });

    const lines = ordered.map((x)=>{
      const part = x.trim().startsWith("2.") ? "2 (Sale)" : "3 (Trans)";
      return `ขาดข้อมูลในส่วนที่ ${part} ข้อที่ ${x}`;
    });
    showModal("error","ข้อมูลไม่ถูกต้อง", lines, { numbered:true });
    btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
    return;
  }

const actual = n0(payload.actual_sale);
const s2 = n0(payload.sale_dine_in) + n0(payload.sale_take_away) + n0(payload.sale_grab) + n0(payload.sale_lineman) + n0(payload.sale_shopeefood);

const total = n0(payload.total_trans);
const t3 = n0(payload.trans_dine_in) + n0(payload.trans_take_away) + n0(payload.trans_grab) + n0(payload.trans_lineman) + n0(payload.trans_shopeefood);

const saleMismatch  = (Math.round(s2 * 100) !== Math.round(actual * 100));
const transMismatch = (Math.round(t3) !== Math.round(total));

// ✅ Labour validation (v1.2.0): hour must be < baht
// - ตรวจร่วมกับเงื่อนไขอื่น ๆ ตอนกด "ตรวจสอบข้อมูล"
// - ข้ามการตรวจ Labour เมื่อเป็นรอบ 16.00 (ฟิลด์ถูกล็อก/ไม่ต้องกรอก)
const slotNow = String(payload.submit_time_slot || "").trim();
const lh = n0(payload.labour_hour);
const lb = n0(payload.labour_baht);
const labourMismatch = (slotNow !== "16.00") && !(lh < lb);

if (saleMismatch || transMismatch || labourMismatch){
  // จัดลำดับข้อความแบบตายตัว: Sale → Trans → Labour
  const rules = [
    { bad: saleMismatch,  msg: "ผลรวมของ Sale (Dine In + Take away + Delivery ต้องเท่ากับ Actual Sale)" },
    { bad: transMismatch, msg: "ผลรวมของ Trans (Dine In + Take away + Delivery ต้องเท่ากับ Total Trans)" },
    { bad: labourMismatch, msg: "4.2 Labour (hour) ต้องน้อยกว่า 4.3 Labour (Baht) เสมอ" }
  ];
  const lines = rules.filter(r => r.bad).map(r => r.msg);

  // ✅ แสดงป็อปอัพเหมือนเดิม แต่ "ไม่ล้างค่า"
  showModal("error","ใส่ข้อมูลไม่ถูกต้อง", lines, {numbered:true});
btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
  return;
}

btn.disabled=false; btn.textContent="ตรวจสอบข้อมูล";
openReview(payload);
return;

});
</script>

<script>
(function(){
  function ping(){
    const el = document.getElementById('serverStatus');
    if(!el) return;

    const cb = "__ping_cb_" + Math.random().toString(36).slice(2);
    const qs = new URLSearchParams({ mode: "ping", callback: cb }).toString();

    let done = false;
    const timer = setTimeout(() => {
      if(done) return;
      done = true;
      try { delete window[cb]; } catch(_){}
      el.style.display = 'block';
    }, 6000);

    window[cb] = (data) => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch(_){}
      // ต้องได้ JSONP กลับมาอย่างน้อย {ok:true}
      if (data && data.ok === true){
        el.style.display = 'none';
      } else {
        el.style.display = 'block';
      }
    };

    const s = document.createElement("script");
    s.src = WEB_APP_URL + "?" + qs + "&_=" + Date.now();
    LAST_JSONP_URL = s.src;

    s.onerror = () => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch(_){}
      el.style.display = 'block';
    };

    document.body.appendChild(s);
    setTimeout(()=>{ try{ s.remove(); }catch(_){} }, 7000);
  }

  window.addEventListener('load', ping);
})();</script>

(function() {
  function byId(id) { return document.getElementById(id); }

  function ensurePlaceholder(sel, text) {
    if (!sel) return;
    let ph = sel.querySelector('option[value=""]');
    if (!ph) {
      ph = document.createElement('option');
      ph.value = "";
      ph.textContent = text;
      sel.insertBefore(ph, sel.firstChild);
    } else {
      ph.textContent = text;
    }
  }

  function resetBranch(brSel) {
    if (!brSel) return;
    brSel.innerHTML = "";
    const ph = document.createElement('option');
    ph.value = "";
    ph.textContent = "— เลือกสาขา —";
    brSel.appendChild(ph);
    brSel.value = "";
    brSel.disabled = true;
  }

  function fillBranch(dm, brSel) {
    resetBranch(brSel);
    const list = DM_BRANCH_MAP[dm] || [];
    list.forEach(function(branch) {
      const opt = document.createElement("option");
      opt.value = branch;
      opt.textContent = branch;
      brSel.appendChild(opt);
    });
    brSel.disabled = false;
  }

  document.addEventListener("DOMContentLoaded", function() {
    const dmSel = byId("district_manager");
    const brSel = byId("branch");

    ensurePlaceholder(dmSel, "— เลือกผู้จัดการเขต —");
    ensurePlaceholder(brSel, "— เลือกสาขา —");

    // 🔒 บังคับให้เริ่มต้นต้องเลือก DM ก่อน
    if (dmSel) dmSel.value = "";
    resetBranch(brSel);

    if (dmSel) {
      dmSel.addEventListener("change", function() {
        const dm = (dmSel.value || "").trim();
        if (!dm) return resetBranch(brSel);
        fillBranch(dm, brSel);
      });
    }
  });
})();
</script>
